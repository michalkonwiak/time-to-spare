[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jeszcze-zdaze"
version = "0.1.0"
description = "Evidence-first short-trip planning with a deterministic feasibility engine"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[project.scripts]
jeszcze-zdaze = "jeszcze_zdaze.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
    "mypy>=1.15,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "hypothesis>=6.125,<7",
    "pre-commit>=4,<5",
    "httpx2>=2.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/jeszcze_zdaze"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["jeszcze_zdaze"]

[tool.coverage.report]
show_missing = true
fail_under = 85
