minimum_pre_commit_version: '3.2.0'
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Strict type checking
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: pre-push-checks
        name: Tests, API contract and package build
        entry: make check build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
